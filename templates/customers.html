{% extends 'base.html' %}
{% block content %}
<h2>Kunden</h2>
<section class="card">
  <form method="get" class="inline">
    <input type="text" name="q" value="{{ q }}" placeholder="Suche Kunde / Nummer / Mail">
    <button type="submit">Suchen</button>
  </form>
</section>

<section class="card">
  <h3>Neuen Kunden anlegen</h3>
  <form method="post" class="grid">
    <label>Kundennummer <input name="customer_number" required></label>
    <label>Name <input name="name" required></label>
    <label>Adresse <input name="address"></label>
    <label>Telefon <input name="phone"></label>
    <label>E-Mail <input type="email" name="email"></label>
    <label>Notizen <textarea name="notes"></textarea></label>
    <button type="submit">Speichern</button>
  </form>
</section>

<section class="card">
  <h3>Bestand</h3>
  <table>
    <thead><tr><th>Nr.</th><th>Name</th><th>E-Mail</th><th>Telefon</th></tr></thead>
    <tbody>
      {% for row in rows %}
      <tr>
        <td>{{ row.customer_number }}</td>
        <td>{{ row.name }}</td>
        <td>{{ row.email or '-' }}</td>
        <td>{{ row.phone or '-' }}</td>
      </tr>
      {% else %}
      <tr><td colspan="4">Keine Kunden vorhanden.</td></tr>
      {% endfor %}
    </tbody>
  </table>
</section>
{% endblock %}
